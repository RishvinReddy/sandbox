name: Update Profile Metrics

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/update-readme.yml"
      - "project_config.json"

concurrency:
  group: profile-readme-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Profile SVG Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          PYTHONPATH=$(pwd)/scripts python scripts/generate_svgs.py

      - name: Commit changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md assets/
          if git diff --cached --quiet; then
            echo "No profile changes detected."
            exit 0
          fi
          git commit -m "chore(profile): refresh dynamic profile data"
          git push
